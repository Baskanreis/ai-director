name: Build Windows Setup

# Tek amaç: dist\AI_Director_Setup.exe üretmek ve bunu tek artifact olarak vermek.
# Manuel calistirma (Actions > Build Windows Setup > Run workflow) veya "v*" etiketi
# push edildiginde tetiklenir. Her push'ta otomatik calismaz cunku bu is FFmpeg,
# Whisper, Qwen ve llama.cpp indirip PyInstaller + Inno Setup ile tam bir Windows
# installer derler; hafif bir islem degildir.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build AI_Director_Setup.exe
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble app/ package layout from flat root uploads
        shell: bash
        run: |
          set -e
          mkdir -p app

          SUBFOLDERS="agents ai audio brain effects export motion performance plugins preview pro project proxy reference render runtime scene shorts subtitle timeline ui video youtube"
          for d in $SUBFOLDERS; do
            if [ -d "$d" ] && [ ! -d "app/$d" ]; then
              echo "Tasiniyor: $d -> app/$d"
              mv "$d" "app/$d"
            fi
          done

          if [ -f "main.py" ] && [ ! -f "app/main.py" ]; then
            mv "main.py" "app/main.py"
          fi

          if [ ! -f app/__init__.py ]; then
            v=$(cat VERSION 2>/dev/null || echo "0.0.0")
            echo "__version__ = \"$v\"" > app/__init__.py
          fi

          echo "--- app/ icerigi ---"
          ls app

          MISSING=""
          for d in $SUBFOLDERS; do
            [ -d "app/$d" ] || MISSING="$MISSING $d"
          done
          [ -f "app/main.py" ] || MISSING="$MISSING main.py"
          if [ -n "$MISSING" ]; then
            echo "::error::Build icin gerekli eksik app alt ogeleri:$MISSING"
            exit 1
          fi

          if [ ! -d "assets" ] || [ -z "$(find assets -name '*.wav' -print -quit)" ]; then
            echo "::error::assets/ klasoru (repo kokunde, 70 .wav dosyasi) eksik veya bos."
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install Inno Setup (ISCC)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $innoDir = "C:\Program Files (x86)\Inno Setup 6"
          if (-not (Test-Path "$innoDir\ISCC.exe")) {
            throw "ISCC.exe bulunamadi: $innoDir"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $innoDir

      - name: Build Setup.exe
        shell: cmd
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_OAUTH_CLIENT_JSON_B64: ${{ secrets.YOUTUBE_OAUTH_CLIENT_JSON_B64 }}
        run: |
          call installer\build_windows.bat --ci

      - name: Upload Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: AI_Director_Setup
          path: dist\AI_Director_Setup.exe
          if-no-files-found: error
          retention-days: 14
