name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Fetch ffmpeg + ffprobe binaries (to embed in the exe)
        shell: pwsh
        run: |
          pip install static-ffmpeg
          python -c "from static_ffmpeg import run; import shutil, pathlib; ffmpeg, ffprobe = run.get_or_fetch_platform_executables_else_raise(); dest = pathlib.Path('tools/ffmpeg'); dest.mkdir(parents=True, exist_ok=True); shutil.copy(ffmpeg, dest / 'ffmpeg.exe'); shutil.copy(ffprobe, dest / 'ffprobe.exe'); print('ffmpeg ->', ffmpeg); print('ffprobe ->', ffprobe)"

      - name: Merge app1 + app2 + app3 into app/
        run: python merge_app.py

      - name: Build EXE with PyInstaller
        run: pyinstaller AI_Director.spec --noconfirm --clean

      - name: Zip the build output
        shell: pwsh
        run: Compress-Archive -Path dist/AI_Director/* -DestinationPath AI_Director-windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI_Director-windows
          path: AI_Director-windows.zip

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AI_Director-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
